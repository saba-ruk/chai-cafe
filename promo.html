<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <style>
    

      .content5 {
        z-index: 2;
        display: grid;
        grid-template-rows: 1fr auto;
        grid-gap: 4rem;
        padding: 2rem;
        background: var(--footer-background);
        text-align: center;
        font-size: 20px;
        font-weight: 500;
        align-items: center;
        font-family: "Open Sans", sans-serif;
      }
      .content5 a,
      .content5 p {
        color: #111;
        text-decoration: none;
      }

      .content5 b {
        color: #111;
      }

      .content5 p {
        margin: 10px 20px;
        font-size: 18px;
      }

      .content5 .image {
        align-self: center;
        width: 4rem;
        height: 4rem;
        margin: 0.25rem 0;
        background-size: cover;
        background-position: center;
      }

      .follow {
        position: relative;
        top: 20px;
      }

      .follow svg {
        padding: 10px;
      }

      .top p {
        font-weight: 400;
        font-size: 23px;
        font-family: Pacifico, cursive;
      }

      .details {
        position: relative;
        margin-top: 20px;
        display: flex;
        flex-direction: row;
        align-items: center;
        text-align: center;
        justify-content: space-around;
        align-items: baseline;
      }

      .info p {
        font-size: 15px;
        font-weight: 500;
        margin: 5px 0;
      }

      .location_container {
        margin-bottom: 80px;
        margin-top: 80px;
      }

      #bubb {
        display: grid;
        grid-template-rows: 1fr 10rem auto;
        grid-template-areas: "main" "." "footer";
        overflow-x: hidden;
        min-height: 60vh;
      }

      .footer {
        z-index: 1;
        --footer-background: #d3b289;
        display: grid;
        position: relative;
        grid-area: footer;
        min-height: 11rem;
      }

      .bubbles {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1rem;
        background: var(--footer-background);
        filter: url("#blob");
      }

      .bubble {
        position: absolute;
        left: var(--position, 50%);
        background: var(--footer-background);
        border-radius: 100%;
        animation: bubble-size var(--time, 4s) ease-in infinite var(--delay, 0s),
          bubble-move var(--time, 4s) ease-in infinite var(--delay, 0s);
        transform: translate(-50%, 100%);
      }

      @keyframes bubble-size {
        0%,
        75% {
          width: var(--size, 4rem);
          height: var(--size, 4rem);
        }

        100% {
          width: 0rem;
          height: 0rem;
        }
      }

      @keyframes bubble-move {
        0% {
          bottom: -4rem;
        }

        100% {
          bottom: var(--distance, 10rem);
        }
      }

      .footer .bubbles .bubble {
        margin-left: 5px;
        margin-right: 5px;
      }

      @media only screen and (max-width: 600px) {
        .follow a svg {
          width: 20px;
          height: 20px;
          padding: 0;
        }

        .content5 {
          padding: 1rem;
          font-size: 14px;
        }

        .details {
          text-align: center;
          margin-top: 10px;
          justify-content: space-around;
          align-items: baseline;
        }

        .info {
          margin: 0 5px;
        }

        .info p {
          font-size: 11px;
        }

        .thanks p {
          font-size: 14px;
        }

        .top p {
          font-size: 15px;
        }

        .footer .content5 {
          grid-template-rows: 1fr;
          text-align: center;
        }
      }
    </style>
    <title>Bubbles Footer</title>
  </head>

  <body>
    <!-- footer of bubbles -->
    <section id="bubb">
      <div class="footer">
        <div class="bubbles">
          <script>
            for (var i = 0; i < 128; i++) {
              const bubble = document.createElement("div");
              bubble.classList.add("bubble");
              bubble.style.setProperty("--size", `${2 + Math.random() * 4}rem`);
              bubble.style.setProperty(
                "--distance",
                `${6 + Math.random() * 4}rem`
              );
              bubble.style.setProperty(
                "--position",
                `${-5 + Math.random() * 110}%`
              );
              bubble.style.setProperty("--time", `${2 + Math.random() * 2}s`);
              bubble.style.setProperty(
                "--delay",
                `${-1 * (2 + Math.random() * 2)}s`
              );
              document.querySelector(".bubbles").appendChild(bubble);
            }
          </script>
        </div>
        <!-- logo -->
        <div class="content5">
          <div class="thanks">

              Thank you for visiting our chai cafe! We hope you savored the

              <p>Location: NH16 Goodluck Road</p>
              <p>Opposite to bus stand,</p>
              <p>Bhatkal, Karnataka.</p>
