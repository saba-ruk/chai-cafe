<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            min-height: 100vh;
            font-family: karla;
            display: flex;
            align-items: center;
            justify-content: center;
          }
          
          .phone-viewport {
            width: 380px;
            height: 600px;
            overflow: hidden;
            background-color: #fafafa;
            border: 10px solid #222;
          }
          
          .carousel-item {
            padding: 30px 10px;
            float: left;
          }
          
          .card {
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
            width: 300px;
          }
          .card__image {
            overflow: hidden;
            position: relative;
          }
          .card__image img {
            transform: scale(1.2);
          }
          .card__image .badge {
            position: absolute;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            margin: auto;
            background-color: white;
            padding: 10px;
            border-radius: 10px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #666;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
          }
          .card__info {
            padding: 30px 30px 50px;
          }
          .card__title {
            font-weight: 400;
            margin-top: 0;
            line-height: 1;
          }
          .card__desc {
            opacity: 0.5;
          }
    </style>


    <script>
        var elem = document.querySelector('.carousel');
var flkty = new Flickity( elem, {
  // options
	imagesLoaded: true,
	cellAlign: 'center',
	contain: true
});

var imgs = document.querySelectorAll(".card__image img");
var docStyle = document.documentElement.style;
var transformProp = typeof docStyle.transform == 'string' ? 'transform' : 'WebkitTransform';
var info = document.querySelector(".info");

flkty.on( 'scroll', function () {
	flkty.slides.forEach( function (slide, i) {
		var img = imgs[i];
		var x = ( slide.target + flkty.x ) * -1/3;
		
		img.style[transformProp] = 'translateX(' + x + 'px) scale(1.3)';
	} );
} );
    </script>
</head>
<body>
        
<div class="phone-viewport">
    <div class="carousel">
      <div class="carousel-item">
        <div class="card">
          <div class="card__image"><img src="http://unsplash.it/300/?image=58" alt=""/>
            <div class="badge"><i class="fa fa-camera-retro"></i></div>
          </div>
          <div class="card__info">
            <h2 class="card__title">
               Project No<sup>02</sup></h2>
            <div class="card__desc">Just another simple card user interface</div>
          </div>
        </div>
      </div>
      <div class="carousel-item">

        </div>
      </div>

</body>
</html>
