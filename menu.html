<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Card Flip</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
  
    <style>
        .card {
            width: 200px; /* Adjusted width */
            height: 300px; /* Adjusted height */
            position: relative;
            border: 2px solid black;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
        }

        .card-front,
        .card-back {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
        }

        .card-front {
            z-index: 2;
        }

        .card-back {
            transform: rotateY(180deg);
            z-index: 1;
        }

        .flipped .card-inner {
            transform: rotateY(180deg);
        }

        .img2{
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-inner">
            <div class="card-front">
                <img class="img2" src="./pics/banana milkshake1 (2).jpg">
                <h5 class="card-title">Front Content</h5>
                <p class="card-text">This is the front side of the card.</p>
                <button class="btn btn-primary btn-flip">Flip</button>
            </div>
            <div class="card-back">
                <img class="img2" src="./pics/banana milkshake1 (2).jpg">
                <h5 class="card-title">Back Content</h5>
                <p class="card-text">This is the back side of the card.</p>
                <button class="btn btn-primary btn-flip">Flip Back</button>
            </div>
        </div>
    </div>
    <!-- Repeat the card structure for other cards -->

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script1.js"></script>
</body>
</html>
